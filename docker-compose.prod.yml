services:
  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    env_file:
      - ./packages/server/.env
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGO_URI: mongodb://mongodb:27017/ekart
    depends_on:
      - mongodb
    restart: unless-stopped
  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - server
    restart: unless-stopped
volumes:
  mongo_data:

version: "3.8"

services:
  # -------------------------------
  # MongoDB for server
  # -------------------------------
  mongodb:
    image: mongo:7
    container_name: ekart-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./data/mongo:/data/db
 # persists database on host (./data/mongo) so data isn’t lost when container stops.
 
  # -------------------------------
  # Strapi CMS
  # -------------------------------
  strapi:
    build:
      context: .
      dockerfile: packages/strapi/Dockerfile
    ports:
      - "1337:1337"
    depends_on:
      - mongodb
    env_file:
      - ./packages/strapi/.env
    volumes:
      - ./packages/strapi:/app/packages/strapi
      - strapi_node_modules:/app/packages/strapi/node_modules
      - ./packages/strapi/public/uploads:/app/packages/strapi/public/uploads

  # -------------------------------
  # Server (Node/Express)
  # -------------------------------
  server:
    command: pnpm dev
    env_file:
      - ./packages/server/.env
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "5001:5001"
    depends_on:
      - mongodb
    environment:
      NODE_ENV: development
      PORT: 5001
      MONGO_URI: mongodb://mongodb:27017/ekart
    volumes:
      - ./packages/server:/app/packages/server
      - server_node_modules:/app/packages/server/node_modules

  # -------------------------------
  # Client (React/Next with Nginx)
  # -------------------------------
  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://server:5001
      CMS_PROXY_TARGET: http://strapi:1337
    depends_on:
      - server
    volumes:
      - ./packages/client:/app/packages/client
      - client_node_modules:/app/packages/client/node_modules

# -------------------------------
# Named volumes
# -------------------------------
volumes:
  strapi_node_modules:
  server_node_modules:

  client_node_modules:

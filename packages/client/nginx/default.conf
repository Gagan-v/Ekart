server {
  listen 80;
  server_name _;

  # Root directory (copied by Dockerfile)
  root /usr/share/nginx/html;
  index index.html;

  # Handle client-side routing (important for React Router)
  location / {
    try_files $uri $uri/ /index.html;
    # ^ If the requested file/path doesn’t exist (like /cart or /profile),
    #   nginx will serve index.html instead — allowing React Router to handle routing.
  }

  # Optional proxy to backend server (Express)
  location /api/ {
    proxy_pass http://server:5000;
  # "server" is the container name in docker-compose
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
